version: '3.8'

services:
  dashboard:
    build: .
    container_name: chippilot-dashboard
    restart: unless-stopped
    command: streamlit run frontend/dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - ./database:/app/database
      - ./reports:/app/reports
    environment:
      - STREAMLIT_SERVER_HEADLESS=true

  api:
    build: .
    container_name: chippilot-api
    restart: unless-stopped
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./database:/app/database
      - ./reports:/app/reports
